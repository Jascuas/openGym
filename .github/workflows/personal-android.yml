name: Personal Android

on:
  pull_request:
  push:
    branches: [main]
    tags: ['android-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'Jascuas/openGym'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Frontend verification
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm test -- --maxWorkers=2
          npm run build
          npm run build:mobile
      - name: Build unsigned release
        working-directory: frontend/android
        run: ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-personal-apk
          path: frontend/android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 7
      # Signing/publication happens only in a tag-triggered run. PRs and manual
      # previews have no access to the release secrets passed to this step.
      - name: Sign and verify reviewed release
        if: startsWith(github.ref, 'refs/tags/android-v') && github.event_name == 'push'
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          expected_tag="android-v$(node -p 'require("./android-release.json").releaseVersion')"
          test "$GITHUB_REF_NAME" = "$expected_tag"
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          test -n "$ANDROID_KEYSTORE_B64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          umask 077
          key="$RUNNER_TEMP/personal-release.jks"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$key"
          mkdir -p release-output
          bt="$ANDROID_HOME/build-tools/35.0.0"
          "$bt/zipalign" -p -f 4 frontend/android/app/build/outputs/apk/release/app-release-unsigned.apk release-output/aligned.apk
          "$bt/apksigner" sign --ks "$key" --ks-key-alias "$ANDROID_KEY_ALIAS" --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEYSTORE_PASSWORD --out release-output/openGym-Personal.apk release-output/aligned.apk
          rm release-output/aligned.apk
          python3 scripts/verify-personal-apk.py release-output/openGym-Personal.apk "$bt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: startsWith(github.ref, 'refs/tags/android-v') && github.event_name == 'push'
        with:
          name: signed-personal-release
          path: release-output/*
          retention-days: 7

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/android-v') && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download verified signed assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --name signed-personal-release --dir release-output
      - name: Publish APK, checksum and exact source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd release-output
          sha256sum --check openGym-Personal.apk.sha256
          cd ..
          gh release create "$GITHUB_REF_NAME" release-output/openGym-Personal.apk release-output/openGym-Personal.apk.sha256 release-output/release.json --verify-tag --draft --title "OpenGym Personal $GITHUB_REF_NAME" --notes-file docs/android-release-notes.md
          gh release edit "$GITHUB_REF_NAME" --draft=false
